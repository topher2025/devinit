# ==============================================================================
# devinit User Configuration
# ==============================================================================

## Your full name.
## Used when generating project metadata.
# fullname = "John Doe"


# ==============================================================================
# Global Defaults
# ==============================================================================

[defaults]

## Default directory where new projects are created.
# path = "."

## Base name of the project's entry point.
## Examples:
##   Python -> main.py
##   C      -> main.c
##   C++    -> main.cpp
##   Java   -> Main.java
# entry = "main"

## Initialize a Git repository.
## Options: true, false
# git = true

## Generate a .gitignore file.
## Options: true, false
# gitignore = true

## Generate Docker support when available.
## Ignored by templates that do not support Docker.
## Options: true, false
# docker = false

## Default project license.
## Supported options:
##   "MIT"
## More licenses will be added in future releases.
# license = "MIT"

## Create a GitHub repository after generation.
## Options: true, false
# github = false

## Make newly-created GitHub repositories public.
## Only applies when github = true.
## Options: true, false
# public = false


# ==============================================================================
# Python
# ==============================================================================

[python]

## Default Python version.
## Supported options:
##   "3.13"
# version = "3.13"

## Default Python package manager.
## Supported options:
##   "uv"
##   "pip"
# pm = "uv"

## Default formatter/linter.
## Supported options:
##   "black"
# linter = "black"


